<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark"><title>Synapse KB · Evidence graph</title>
<style>
*{box-sizing:border-box}html,body{height:100%}body{margin:0;display:flex;flex-direction:column;background:#0b1120;color:#e2e8f0;font:14px system-ui,sans-serif}header{padding:16px 22px;border-bottom:1px solid #263349;background:#101a2c}h1{margin:0 0 4px;font-size:21px;letter-spacing:-.5px}h1 span{color:#67e8c7}p{line-height:1.55;color:#aab8ce;margin:6px 0}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;align-items:center}button,select,input[type=search]{background:#17243a;color:#e2e8f0;border:1px solid #34445f;border-radius:7px;padding:8px 10px;font:inherit}button{cursor:pointer}button:hover{border-color:#67e8c7}input[type=search]{flex:1;min-width:180px}main{flex:1;min-height:360px;display:grid;grid-template-columns:minmax(0,1fr) 340px}#stage{position:relative;min-width:0;min-height:0;overflow:hidden;background:radial-gradient(ellipse at center,#152137,#0b1120)}canvas{position:absolute;inset:0;touch-action:none;cursor:grab}canvas:focus-visible{outline:2px solid #67e8c7;outline-offset:-2px}aside{padding:20px;overflow:auto;border-left:1px solid #263349}aside h2{font-size:18px;overflow-wrap:anywhere;margin-top:0}aside h3{font-size:13px;color:#aab8ce;margin:18px 0 6px;text-transform:uppercase;letter-spacing:.04em}pre{white-space:pre-wrap;word-break:break-word;color:#67e8c7;background:#101a2c;padding:12px;border-radius:7px}.card{margin:10px 0;padding:12px;border:1px solid #34445f;border-radius:8px;cursor:pointer}.card:hover,.card:focus-visible{border-color:#67e8c7}.tag{color:#67e8c7;font-size:12px}.card p{font-size:13px}#counts{font-size:12px;color:#aab8ce;margin-top:10px}#empty{position:absolute;padding:30px;pointer-events:none;z-index:1}#legend{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:1px solid #34445f;border-radius:999px;font-size:12px;cursor:pointer;background:#17243a;color:#e2e8f0}.chip i{width:10px;height:10px;border-radius:50%;display:inline-block}.chip.on{border-color:#e2e8f0}label.check{display:inline-flex;align-items:center;gap:6px}.item{display:block;width:100%;text-align:left;margin:4px 0;padding:6px 10px;font-size:13px;overflow-wrap:anywhere}@media(max-width:760px){main{grid-template-columns:1fr;grid-template-rows:55vh auto}aside{border-left:0;border-top:1px solid #263349}}
</style></head><body>
<header><h1>Synapse <span>KB</span> <small> / evidence graph</small></h1><p>Explore source relationships. Every automatic edge is a candidate to verify.</p>
<div class="controls"><select id="mode" aria-label="Graph level"><option value="macro">Sections</option><option value="micro">Passages &amp; notes</option></select><select id="kind" aria-label="Relationship type"><option value="all">All relationships</option></select><select id="folder" aria-label="Source folder"><option value="all">All folders</option></select><input id="search" type="search" aria-label="Search graph" placeholder="Search title, path, anchor or cue…"><label class="check"><input id="structure" type="checkbox" checked> Folders &amp; documents</label><label class="check"><input id="linked" type="checkbox"> Only linked</label><button id="reset">Fit view</button></div><div id="legend" aria-label="Source folders"></div><div id="counts"></div></header>
<main><div id="stage"><div id="empty"></div><canvas id="canvas" tabindex="0" aria-label="Evidence graph. Arrow keys pan, plus and minus zoom. The side panel lists the same nodes as buttons."></canvas></div><aside id="inspector"></aside></main>
<script>
'use strict';
const DATA = /*__ATLAS_DATA__*/;
const $=id=>document.getElementById(id);
const labels={eccezione_deroga:'Exception',prerequisito_vincolo:'Prerequisite',biforcazione_caso:'Conditional branch',appunto_volatile:'Volatile note',appunto_condiviso:'Shared note',correzione_agente:'Explicit correction',ambito_applicazione:'Scope limit',sostituzione_versione:'Supersedes',riferimento_esplicito:'Stated reference',struttura:'Contains'};
const colors={eccezione_deroga:'#fb7185',prerequisito_vincolo:'#fbbf24',biforcazione_caso:'#60a5fa',appunto_volatile:'#c084fc',appunto_condiviso:'#67e8c7',correzione_agente:'#e2e8f0',ambito_applicazione:'#fb923c',sostituzione_versione:'#f472b6',riferimento_esplicito:'#a3e635'};
const palette=['#60a5fa','#fbbf24','#f472b6','#34d399','#c084fc','#fb923c','#22d3ee','#a3e635','#f87171','#94a3b8'];
const folders=[...new Set([...DATA.macro.nodes,...DATA.micro.nodes].map(n=>n.folder))].sort();
const folderColors=new Map([['Notes','#67e8c7']]);folders.filter(f=>f!=='Notes').forEach((f,i)=>folderColors.set(f,palette[i%palette.length]));
const kinds=[...new Set([...DATA.macro.edges,...DATA.micro.edges].map(e=>e.kind))].filter(k=>k!=='struttura').sort();
const radius={folder:13,document:8,note:7};
const canvas=$('canvas'),ctx=canvas.getContext('2d');
let nodes=[],edges=[],selected=null,near=new Set(),hover=null,panX=0,panY=0,scale=1,W=1,H=1,drag=null,moved=false,ticks=0,maxTicks=0,raf=0,dirty=true,leaves=0;
function option(id,value,label){const o=document.createElement('option');o.value=value;o.textContent=label;$(id).append(o)}
function text(tag,value,parent){const e=document.createElement(tag);e.textContent=value;parent.append(e);return e}
folders.forEach(f=>{option('folder',f,f);const c=document.createElement('button');c.className='chip';c.dataset.folder=f;const dot=document.createElement('i');dot.style.background=folderColors.get(f);c.append(dot,document.createTextNode(f));c.addEventListener('click',()=>{$('folder').value=$('folder').value===f?'all':f;apply()});$('legend').append(c)});
kinds.forEach(k=>option('kind',k,labels[k]||k));
// A large snapshot starts with only the linked nodes: the rest can be switched on.
$('linked').checked=DATA.macro.nodes.length>250;

function apply(){
 selected=null;near=new Set();hover=null;moved=false;
 const data=DATA[$('mode').value],structure=$('structure').checked,query=$('search').value.toLocaleLowerCase(),folder=$('folder').value,kind=$('kind').value;
 for(const c of $('legend').children)c.classList.toggle('on',c.dataset.folder===folder);
 let pool=data.nodes,links=data.edges.filter(e=>e.kind==='struttura'?structure:(kind==='all'||e.kind===kind));
 if(!structure)pool=pool.filter(n=>n.type!=='folder'&&n.type!=='document');
 const hits=new Set();if(query)for(const e of links)if(e.kind!=='struttura'&&(e.cue+' '+e.anchor+' '+e.kind).toLocaleLowerCase().includes(query)){hits.add(e.source);hits.add(e.target)}
 let keep=new Map();for(const n of pool)if((folder==='all'||n.folder===folder)&&(!query||n.type==='folder'||n.type==='document'||hits.has(n.id)||(n.label+' '+n.path+' '+n.id).toLocaleLowerCase().includes(query)))keep.set(n.id,n);
 links=links.filter(e=>keep.has(e.source)&&keep.has(e.target));
 if(kind!=='all'||query||$('linked').checked){
  // Keep nodes that take part in a relationship (or match the search), plus the hubs above them.
  const wanted=new Set();for(const e of links)if(e.kind!=='struttura'){wanted.add(e.source);wanted.add(e.target)}
  if(query)for(const n of keep.values())if(n.type!=='folder'&&n.type!=='document')wanted.add(n.id);
  for(let pass=0;pass<2;pass++)for(const e of links)if(e.kind==='struttura'&&wanted.has(e.target))wanted.add(e.source);
  keep=new Map([...keep].filter(([id])=>wanted.has(id)));links=links.filter(e=>keep.has(e.source)&&keep.has(e.target));
 }
 const shown=[...new Set([...keep.values()].map(n=>n.folder))].sort(),ring=shown.length>1?24*Math.sqrt(keep.size)+80:0,home=new Map(shown.map((f,i)=>[f,[ring*Math.cos(i*2*Math.PI/shown.length),ring*Math.sin(i*2*Math.PI/shown.length)]]));
 const byId=new Map();nodes=[];let i=0;
 for(const n of keep.values()){const h=home.get(n.folder),spread=70*Math.sqrt((i+1)/keep.size)+20,node={...n,i,hx:h[0],hy:h[1],x:h[0]+spread*Math.cos(i*2.39996),y:h[1]+spread*Math.sin(i*2.39996),vx:0,vy:0,r:radius[n.type]||5,color:folderColors.get(n.folder)||'#94a3b8',out:[],inc:[]};nodes.push(node);byId.set(n.id,node);i++}
 edges=links.map(e=>{const edge={...e,a:byId.get(e.source),b:byId.get(e.target),structural:e.kind==='struttura'};if(!edge.structural){edge.a.out.push(edge);edge.b.inc.push(edge)}return edge});
 leaves=nodes.filter(n=>n.type!=='folder'&&n.type!=='document').length;
 const total=data.nodes.filter(n=>n.type!=='folder'&&n.type!=='document').length,rel=data.edges.filter(e=>e.kind!=='struttura').length;
 $('counts').textContent=`Snapshot: ${total}/${data.total_nodes} nodes, ${rel}/${data.total_edges} relationships. Shown now: ${leaves} nodes, ${edges.filter(e=>!e.structural).length} relationships`+($('linked').checked?' (only linked; untick to see the rest)':'')+'. Dotted lines: folder and document membership, not a dependency. Scores rank candidates.';
 $('empty').textContent=nodes.length?'':'No nodes match this view. Change filters or build the index.';
 ticks=0;maxTicks=nodes.length>2500?120:260;listing();fit();kick();
}

// Layout: springs plus repulsion limited to neighbouring grid cells, so cost grows with the
// number of nodes, not its square. It runs in slices of a frame and then stops completely.
function step(){
 const cell=150,grid=new Map();
 for(const n of nodes){n.vx-=(n.x-n.hx)*.012;n.vy-=(n.y-n.hy)*.012;n.cx=Math.floor(n.x/cell);n.cy=Math.floor(n.y/cell);const key=n.cx*100003+n.cy;let list=grid.get(key);if(!list)grid.set(key,list=[]);list.push(n)}
 for(const a of nodes)for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++){const list=grid.get((a.cx+dx)*100003+a.cy+dy);if(!list)continue;for(const b of list){if(b.i<=a.i)continue;const x=a.x-b.x||.01,y=a.y-b.y||.01,d2=x*x+y*y;if(d2>cell*cell)continue;const f=140/Math.max(60,d2);a.vx+=x*f;a.vy+=y*f;b.vx-=x*f;b.vy-=y*f}}
 for(const e of edges){const a=e.a,b=e.b,x=b.x-a.x,y=b.y-a.y,d=Math.max(1,Math.hypot(x,y)),f=e.structural?(d-(a.type==='folder'?140:45))*.03:(d-130)*.004;a.vx+=x/d*f;a.vy+=y/d*f;b.vx-=x/d*f;b.vy-=y/d*f}
 for(const n of nodes){if(drag&&drag.node===n){n.vx=n.vy=0;continue}n.x+=n.vx*.5;n.y+=n.vy*.5;n.vx*=.6;n.vy*=.6}
}
function frame(){raf=0;if(ticks<maxTicks){const start=performance.now();do{step();ticks++}while(ticks<maxTicks&&performance.now()-start<10);if(!moved&&(ticks%40===0||ticks>=maxTicks))fit();dirty=true}if(dirty){dirty=false;draw()}if(ticks<maxTicks)kick()}
function kick(){dirty=true;if(!raf)raf=requestAnimationFrame(frame)}
function resize(){const box=$('stage').getBoundingClientRect(),ratio=window.devicePixelRatio||1;W=Math.max(1,box.width);H=Math.max(1,box.height);canvas.width=Math.round(W*ratio);canvas.height=Math.round(H*ratio);canvas.style.width=W+'px';canvas.style.height=H+'px';kick()}
function fit(){if(!nodes.length){panX=W/2;panY=H/2;scale=1;return kick()}let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;for(const n of nodes){x0=Math.min(x0,n.x);x1=Math.max(x1,n.x);y0=Math.min(y0,n.y);y1=Math.max(y1,n.y)}scale=Math.max(.08,Math.min(1.6,.9*Math.min(W/Math.max(1,x1-x0+160),H/Math.max(1,y1-y0+60))));panX=W/2-scale*(x0+x1)/2;panY=H/2-scale*(y0+y1)/2;kick()}
function lit(e){return !selected||e.a===selected||e.b===selected}
function draw(){
 const ratio=window.devicePixelRatio||1;ctx.setTransform(ratio,0,0,ratio,0,0);ctx.clearRect(0,0,W,H);ctx.translate(panX,panY);ctx.scale(scale,scale);
 const px=1/scale;
 ctx.setLineDash([2*px,4*px]);ctx.lineWidth=px;
 for(const pass of [false,true]){ctx.globalAlpha=pass?.55:(selected?.08:.3);for(const [folder,color] of folderColors){ctx.strokeStyle=color;ctx.beginPath();let any=false;for(const e of edges)if(e.structural&&e.a.folder===folder&&(lit(e)&&!!selected)===pass){ctx.moveTo(e.a.x,e.a.y);ctx.lineTo(e.b.x,e.b.y);any=true}if(any)ctx.stroke()}}
 ctx.setLineDash([]);ctx.lineWidth=Math.max(1.6*px,1.2);
 const dense=edges.length-nodes.length;for(const e of edges){if(e.structural)continue;const on=lit(e),color=colors[e.kind]||'#cbd5e1';ctx.globalAlpha=!on?.07:selected||dense<160?.9:.45;ctx.strokeStyle=ctx.fillStyle=color;const x=e.b.x-e.a.x,y=e.b.y-e.a.y,d=Math.max(1,Math.hypot(x,y)),ux=x/d,uy=y/d,tx=e.b.x-ux*(e.b.r+2),ty=e.b.y-uy*(e.b.r+2),s=Math.max(6,5*px);ctx.beginPath();ctx.moveTo(e.a.x,e.a.y);ctx.lineTo(tx,ty);ctx.stroke();ctx.beginPath();ctx.moveTo(tx,ty);ctx.lineTo(tx-ux*s-uy*s*.5,ty-uy*s+ux*s*.5);ctx.lineTo(tx-ux*s+uy*s*.5,ty-uy*s-ux*s*.5);ctx.fill()}
 for(const n of nodes){const on=!selected||n===selected||near.has(n);ctx.globalAlpha=on?1:.25;ctx.beginPath();ctx.arc(n.x,n.y,n.r,0,6.2832);if(n.type==='folder'){ctx.fillStyle='#0b1120';ctx.fill();ctx.lineWidth=4;ctx.strokeStyle=n.color;ctx.stroke()}else{ctx.fillStyle=n.color;ctx.globalAlpha*=n.type==='document'||n.type==='note'?1:.8;ctx.fill()}if(n===selected||n===hover){ctx.globalAlpha=1;ctx.lineWidth=2*px;ctx.strokeStyle='#fff';ctx.beginPath();ctx.arc(n.x,n.y,n.r+3*px,0,6.2832);ctx.stroke()}}
 // Labels: folders and documents always; passages only when they can be read.
 const leafLabels=leaves<=140||scale>=1.15;ctx.textBaseline='middle';
 for(const n of nodes){const hub=n.type==='folder'||n.type==='document',focus=n===selected||n===hover||near.has(n);if(!hub&&!focus&&!leafLabels)continue;if(selected&&!focus&&!hub)continue;ctx.globalAlpha=!selected||focus?1:.35;const sizePx=n.type==='folder'?15:n.type==='document'?12:11,font=Math.max(sizePx,(n.type==='folder'?13:hub?9:0)*px);ctx.font=(hub?'600 ':'')+font+'px system-ui,sans-serif';ctx.fillStyle=n.type==='folder'?'#f8fafc':hub?'#e2e8f0':'#ced8e9';ctx.fillText(n.label.length>40?n.label.slice(0,39)+'…':n.label,n.x+n.r+5*Math.max(1,px*.6),n.y)}
 ctx.globalAlpha=1;
}
function at(ev){const box=canvas.getBoundingClientRect(),x=(ev.clientX-box.left-panX)/scale,y=(ev.clientY-box.top-panY)/scale;let best=null,limit=1e9;for(const n of nodes){const d=Math.hypot(n.x-x,n.y-y)-n.r;if(d<6/scale&&d<limit){best=n;limit=d}}return {x,y,node:best}}

function listing(){const p=$('inspector');p.replaceChildren();text('h2','Select a node',p);text('p','Click a node, or pick one below. Drag nodes to arrange, drag the background to pan, use the wheel to zoom. Passage titles appear when you zoom in or select a node.',p);text('p',DATA.notice,p);
 const hubs=nodes.filter(n=>n.type==='document'),list=(hubs.length?hubs:[...nodes].sort((a,b)=>b.out.length+b.inc.length-a.out.length-a.inc.length)).slice(0,120);
 let last=null;for(const n of list.sort((a,b)=>a.folder.localeCompare(b.folder)||a.label.localeCompare(b.label))){if(n.folder!==last){last=n.folder;text('h3',n.folder,p).style.color=folderColors.get(n.folder)}const b=text('button',n.label,p);b.className='item';b.addEventListener('click',()=>inspect(n,true))}}
function inspect(n,center){selected=n;near=new Set();for(const e of edges)if(e.a===n)near.add(e.b);else if(e.b===n)near.add(e.a);
 if(center){moved=true;scale=Math.max(scale,.9);panX=W/2-n.x*scale;panY=H/2-n.y*scale}
 const p=$('inspector');p.replaceChildren();const back=text('button','← All documents',p);back.addEventListener('click',()=>{selected=null;near=new Set();listing();kick()});
 text('h2',n.label,p);text('p',n.path+(n.type==='folder'?'':':'+n.line),p);const chip=text('span',n.folder,p);chip.className='chip';chip.style.borderColor=folderColors.get(n.folder);if(n.status)text('p',n.status+' / '+n.author,p);text('pre',n.command,p);text('p','Run this command from the workspace. Read complete passages and note bodies.',p);
 const inside=edges.filter(e=>e.structural&&e.a===n).map(e=>e.b);if(inside.length){text('h3','Contains ('+inside.length+')',p);for(const child of inside.slice(0,150)){const b=text('button',child.label,p);b.className='item';b.addEventListener('click',()=>inspect(child,true))}}
 for(const[title,list,incoming]of [['Outgoing',n.out,false],['Incoming',n.inc,true]]){if(n.type==='folder'||n.type==='document')continue;text('h3',title+' ('+list.length+')',p);for(const e of list){const target=incoming?e.a:e.b,card=document.createElement('div');card.className='card';card.tabIndex=0;card.setAttribute('role','button');text('div',(labels[e.kind]||e.kind)+' / '+e.origin,card).className='tag';text('strong',target.label,card);text('p',e.cue,card);text('p','Anchor: '+e.anchor+' · score '+e.score,card);card.addEventListener('click',()=>inspect(target,true));card.addEventListener('keydown',ev=>{if(ev.key==='Enter')inspect(target,true)});p.append(card)}}
 kick()}

canvas.addEventListener('pointerdown',ev=>{const hit=at(ev);canvas.setPointerCapture(ev.pointerId);drag={node:hit.node,sx:ev.clientX,sy:ev.clientY,px:panX,py:panY,far:false};canvas.style.cursor='grabbing'});
canvas.addEventListener('pointermove',ev=>{if(!drag){const hit=at(ev).node;if(hit!==hover){hover=hit;canvas.style.cursor=hit?'pointer':'grab';kick()}return}if(Math.hypot(ev.clientX-drag.sx,ev.clientY-drag.sy)>4)drag.far=true;if(!drag.far)return;moved=true;if(drag.node){const w=at(ev);drag.node.x=w.x;drag.node.y=w.y}else{panX=drag.px+ev.clientX-drag.sx;panY=drag.py+ev.clientY-drag.sy}kick()});
canvas.addEventListener('pointerup',()=>{if(drag&&!drag.far&&drag.node)inspect(drag.node,false);drag=null;canvas.style.cursor='grab'});
canvas.addEventListener('pointercancel',()=>{drag=null});
canvas.addEventListener('wheel',ev=>{ev.preventDefault();moved=true;const box=canvas.getBoundingClientRect(),mx=ev.clientX-box.left,my=ev.clientY-box.top,next=Math.max(.05,Math.min(6,scale*(ev.deltaY>0?.88:1.14)));panX=mx-(mx-panX)*next/scale;panY=my-(my-panY)*next/scale;scale=next;kick()},{passive:false});
canvas.addEventListener('keydown',ev=>{const move={ArrowLeft:[40,0],ArrowRight:[-40,0],ArrowUp:[0,40],ArrowDown:[0,-40]}[ev.key];if(move){panX+=move[0];panY+=move[1]}else if(ev.key==='+'||ev.key==='=')scale=Math.min(6,scale*1.15);else if(ev.key==='-')scale=Math.max(.05,scale*.87);else return;ev.preventDefault();moved=true;kick()});
for(const id of ['mode','kind','folder','structure','linked'])$(id).addEventListener('change',apply);
let typing=0;$('search').addEventListener('input',()=>{clearTimeout(typing);typing=setTimeout(apply,180)});
$('reset').addEventListener('click',()=>{moved=false;fit()});window.addEventListener('resize',resize);
resize();apply();
</script></body></html>
