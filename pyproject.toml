[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synapse-kb"
version = "0.1.0a1"
description = "Local document navigation, related evidence and guided workspaces for tool-capable LLM agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "licenses/pypdf.txt"]
authors = [{name = "Tiziano Carpentieri"}]
dependencies = []
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Operating System :: OS Independent"]

[project.optional-dependencies]
pdf = ["pypdf==6.21.1"]

[project.scripts]
synapse-kb = "atlas_core.cli:main"

[tool.setuptools.packages.find]
include = ["atlas_core*"]

[tool.setuptools.package-data]
atlas_core = ["viewer.html"]
